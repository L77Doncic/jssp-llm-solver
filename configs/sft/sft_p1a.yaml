# SFT 阶段 1a：6x6（20000 样本，train 16023）
# max_length 4096：6x6 完整样本最大 1611 tokens，余量充足
# batch 2×accum16 = 有效 32；显存实测 31.2GB（expandable_segments 必需）

model:
  base_model: /root/autodl-tmp/jssp_data/models/Qwen2.5-7B-Instruct
  dtype: bf16

data:
  dataset_path: /root/autodl-tmp/jssp_data/supervised/sft_dataset.jsonl
  splits_dir: /root/autodl-tmp/jssp_data/splits
  max_length: 4096
  mask_prompt: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 16   # 有效 batch = 32
  learning_rate: 2.0e-4
  num_epochs: 2
  warmup_steps: 60                  # 约 1002 步 × 6%（两阶段各自 warmup）
  logging_steps: 50
  eval_steps: 500
  save_steps: 1000
  save_total_limit: 2
  gradient_checkpointing: true
  output_dir: /root/jssp/experiments/sft_qwen7b

seed: 42
